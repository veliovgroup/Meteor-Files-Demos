<head>
  <title>Meteor-Files: Download Button</title>
</head>

<body>
  <header>
    <h1>Meteor-Files: Download Button</h1>
  </header>

  <main>
    <strong>List of Files:</strong><br>
    {{> file}}
  </main>

  <footer>
    <p>See <a href="https://github.com/veliovgroup/Meteor-Files"><code>ostrio:files</code></a> library for more details</p>
  </footer>
</body>

<template name='file'>
  {{#each file in files}}
    <a href="{{file.link}}?download=true" download="{{file.name}}" target="_parent" type="{{file.type}}">
      {{file.name}}
    </a> — Click to download (<a href="{{file.link}}" target="_blank">view inline</a>)<br>
  {{else}}
    loading...
  {{/each}}
</template>
